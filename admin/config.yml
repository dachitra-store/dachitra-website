backend:
  name: turbo-github
  turbo_site_id: 953a4e0d-7898-4838-add3-496f32609535
  branch: main
media_folder: "assets/products"
public_folder: "/assets/products"

collections:
  - name: "catalogue"
    label: "DACHITRA Catalogue"
    files:
      - name: "products"
        label: "Products"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Product list"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Product name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Price", name: "price", widget: "string", default: "Price on Request" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Main product photo", name: "image", widget: "image", required: false }
              - label: "Additional product photos (up to 4)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "Photo", name: "photo", widget: "image" }
              - { label: "Fabric", name: "fabric", widget: "string", required: false }
              - { label: "Craft", name: "craft", widget: "string", required: false }
              - { label: "Colour", name: "colour", widget: "string", required: false }
              - { label: "Dye", name: "dye", widget: "string", required: false }
              - { label: "Saree length", name: "saree_length", widget: "string", required: false }
              - { label: "Blouse piece", name: "blouse_piece", widget: "string", required: false }
              - { label: "Wash care", name: "wash_care", widget: "text", required: false }
              - { label: "Available for enquiry", name: "available", widget: "boolean", default: true }
